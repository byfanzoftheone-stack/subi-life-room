<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SUBI LIFE · Meshy GLB</title>
  <style>
    html, body, #stage { margin: 0; height: 100%; background: #041018; color: #eef7ff; font-family: ui-monospace, monospace; }
    header, footer { position: fixed; left: 14px; right: 14px; z-index: 5; }
    header { top: 12px; display: flex; justify-content: space-between; gap: 12px; }
    footer { bottom: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
    h1 { margin: 0; color: #ffd24a; font-size: 22px; letter-spacing: .08em; }
    small { display: block; color: #5be9ff; letter-spacing: .2em; font-size: 9px; }
    .note { max-width: 220px; text-align: right; font-size: 11px; color: #b7c9d8; }
    button, a.btn { appearance: none; text-decoration: none; border: 0; cursor: pointer; padding: 10px 14px; border-radius: 999px; background: #ffd24a; color: #041018; font: 11px ui-monospace, monospace; letter-spacing: .12em; }
    a.btn { background: transparent; color: #5be9ff; border: 1px solid #5be9ff66; }
    #hud { position: fixed; left: 14px; top: 64px; font-size: 11px; color: #5be9ff; z-index: 5; }
  </style>
</head>
<body>
  <header>
    <div>
      <small>THE ONE AGENTIC CITY · ROOM</small>
      <h1>SUBI LIFE</h1>
    </div>
    <div class="note">Meshy Blue Speedster GLB. Digital tribute — not the real STI.</div>
  </header>
  <div id="hud">LOADING /glbs/blue-speedster.glb</div>
  <div id="stage"></div>
  <footer>
    <button id="spin">PAUSE</button>
    <a class="btn" href="https://the-one-agentic-city.vercel.app">CITY HUB</a>
  </footer>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    const URLS = ['/glbs/blue-speedster.glb'];
    const hud = document.getElementById('hud');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.getElementById('stage').appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x041018);
    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 80);
    camera.position.set(5.2, 2.2, 6.4);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.8;
    scene.add(new THREE.AmbientLight(0xc0d8ff, 0.8));
    const sun = new THREE.DirectionalLight(0xffffff, 1.3);
    sun.position.set(6, 10, 4);
    scene.add(sun);
    scene.add(new THREE.PointLight(0x1b6fe0, 8, 18)).position.set(-4, 3, -2);
    scene.add(new THREE.PointLight(0xffd700, 4, 12)).position.set(3, 2, 4);
    const ground = new THREE.Mesh(new THREE.CircleGeometry(8, 48), new THREE.MeshStandardMaterial({ color: 0x0a1a2c, metalness: 0.4, roughness: 0.35 }));
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);
    function fit(root) {
      const box = new THREE.Box3().setFromObject(root);
      const size = new THREE.Vector3();
      const cent = new THREE.Vector3();
      box.getSize(size); box.getCenter(cent);
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const s = 4.6 / maxDim;
      root.scale.setScalar(s);
      root.position.set(-cent.x * s, -box.min.y * s, -cent.z * s);
    }
    const loader = new GLTFLoader();
    function tryLoad(i) {
      if (i >= URLS.length) {
        hud.textContent = 'DROP public/glbs/blue-speedster.glb THEN REFRESH';
        return;
      }
      loader.load(URLS[i], (gltf) => {
        fit(gltf.scene);
        scene.add(gltf.scene);
        hud.textContent = 'MESHY SUBI ONLINE';
      }, (ev) => {
        if (ev.total) hud.textContent = 'LOADING ' + Math.round((ev.loaded / ev.total) * 100) + '%';
      }, () => tryLoad(i + 1));
    }
    tryLoad(0);
    document.getElementById('spin').onclick = () => {
      controls.autoRotate = !controls.autoRotate;
      document.getElementById('spin').textContent = controls.autoRotate ? 'PAUSE' : 'SPIN';
    };
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    (function tick(){ controls.update(); renderer.render(scene, camera); requestAnimationFrame(tick); })();
  </script>
</body>
</html>
