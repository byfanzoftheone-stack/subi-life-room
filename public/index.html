<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#041018" />
  <title>SUBI LIFE · OFFLINE RACE</title>
  <link rel="manifest" href="/manifest.json" />
  <style>
    html,body,#stage{margin:0;height:100%;background:#041018;color:#eef7ff;font-family:ui-monospace,monospace;overflow:hidden;touch-action:none}
    header{position:fixed;top:10px;left:12px;right:12px;z-index:6;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
    h1{margin:0;color:#ffd24a;font-size:20px;letter-spacing:.08em}
    small{display:block;color:#5be9ff;letter-spacing:.18em;font-size:9px}
    #hud{position:fixed;top:58px;left:12px;z-index:6;font-size:12px;color:#5be9ff}
    #score{position:fixed;top:58px;right:12px;z-index:6;text-align:right;font-size:12px;color:#ffd24a}
    #gate{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(4,16,24,.72)}
    #gate .card{width:min(360px,92vw);background:#061820;border:1px solid #5be9ff44;border-radius:18px;padding:18px}
    #gate h2{margin:0 0 8px;color:#ffd24a}
    #gate p{margin:0 0 14px;color:#b7c9d8;font-size:13px;line-height:1.45}
    button{appearance:none;border:0;cursor:pointer;padding:12px 16px;border-radius:999px;background:#ffd24a;color:#041018;font:12px ui-monospace,monospace;letter-spacing:.12em}
    #pads{position:fixed;bottom:18px;left:12px;right:12px;z-index:7;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
    .col{display:flex;gap:8px;align-items:flex-end}
    .pad{pointer-events:auto;width:72px;height:72px;border-radius:50%;border:2px solid #ffffff44;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(0,0,0,.45);user-select:none}
    .pad.gold{border-color:#ffd24a;color:#ffd24a;width:82px;height:82px}
    .pad.cyan{border-color:#5be9ff;color:#5be9ff;width:64px;height:44px;border-radius:10px}
    .pad:active{background:#ffd24a33}
  </style>
</head>
<body>
  <header>
    <div><small>OWN SPACE · OFFLINE MODE</small><h1>SUBI LIFE</h1></div>
    <div style="text-align:right;font-size:11px;color:#b7c9d8">tribute · not the real STI</div>
  </header>
  <div id="hud">BOOTING TRACK</div>
  <div id="score">0<br><span style="color:#8ea6b8">BEST 0</span></div>
  <div id="stage"></div>
  <div id="pads">
    <div class="col">
      <div class="pad" data-k="left">&#9664;</div>
      <div class="pad" data-k="right">&#9654;</div>
    </div>
    <div class="col">
      <div class="pad cyan" data-k="drift">DRIFT</div>
      <div class="pad cyan" data-k="back">BRAKE</div>
      <div class="pad gold" data-k="fwd">GAS</div>
    </div>
  </div>
  <div id="gate">
    <div class="card">
      <h2>OFFLINE RACE</h2>
      <p>Track stays locked. Camera hangs off the rear-right. Car stays center screen.</p>
      <button id="go">START</button>
    </div>
  </div>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    const KEYS = {fwd:false,back:false,left:false,right:false,drift:false};
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');
    const best0 = Number(localStorage.getItem('subi-best')||0);
    let running = false, dist = 0;
    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.getElementById('stage').appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x041018);
    scene.fog = new THREE.Fog(0x041018, 70, 240);
    const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 500);
    camera.position.set(4, 8, 16);
    scene.add(new THREE.AmbientLight(0x9ec8ff, 0.7));
    const sun = new THREE.DirectionalLight(0xffffff, 1.15);
    sun.position.set(8, 20, 6);
    scene.add(sun);
    scene.add(new THREE.PointLight(0x1b6fe0, 10, 40)).position.set(-8, 6, -6);
    scene.add(new THREE.PointLight(0xffd700, 6, 24)).position.set(4, 4, 6);
    function fit(root, size){
      const box = new THREE.Box3().setFromObject(root);
      const s = new THREE.Vector3(); const c = new THREE.Vector3();
      box.getSize(s); box.getCenter(c);
      const max = Math.max(s.x,s.y,s.z)||1;
      const k = size/max;
      root.scale.setScalar(k);
      root.position.set(-c.x*k, -box.min.y*k, -c.z*k);
    }
    function lockTrack(root){
      root.rotation.set(0,0,0);
      root.updateMatrix();
      root.matrixAutoUpdate = false;
      root.traverse(o => { o.matrixAutoUpdate = false; if (o !== root) o.updateMatrix(); });
    }
    function loadGLB(url){
      return new Promise((res,rej)=> new GLTFLoader().load(url, g=>res(g.scene), undefined, rej));
    }
    function makeFallbackCar(){
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.8,0.42,4.3), new THREE.MeshStandardMaterial({color:0x0147a6, metalness:.7, roughness:.22}));
      body.position.y = 0.62; g.add(body);
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.4,0.5,1.8), new THREE.MeshStandardMaterial({color:0x0b1a44, metalness:.3, roughness:.2}));
      cabin.position.set(0,1.1,-0.3); g.add(cabin);
      [[.95,1.3],[-.95,1.3],[.95,-1.35],[-.95,-1.35]].forEach(([x,z])=>{
        const w = new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.28,14), new THREE.MeshStandardMaterial({color:0x111, metalness:.4}));
        w.rotation.z = Math.PI/2; w.position.set(x,.38,z); g.add(w);
      });
      return g;
    }
    function makeFallbackTrack(){
      const g = new THREE.Group();
      const ring = new THREE.Mesh(new THREE.RingGeometry(26, 40, 96), new THREE.MeshStandardMaterial({color:0x101820, metalness:.2, roughness:.8, side:THREE.DoubleSide}));
      ring.rotation.x = -Math.PI/2; g.add(ring);
      const line = new THREE.Mesh(new THREE.RingGeometry(32.6, 33.4, 96), new THREE.MeshBasicMaterial({color:0xffd24a, side:THREE.DoubleSide}));
      line.rotation.x = -Math.PI/2; line.position.y = 0.02; g.add(line);
      for(let i=0;i<22;i++){
        const a = i/22*Math.PI*2;
        const p = new THREE.Mesh(new THREE.BoxGeometry(.35,1.8,1.6), new THREE.MeshStandardMaterial({color:0xffd24a, emissive:0xffd24a, emissiveIntensity:.4}));
        p.position.set(Math.sin(a)*40.6, .9, Math.cos(a)*40.6);
        g.add(p);
      }
      return g;
    }
    const carWrap = new THREE.Group();
    let carMesh = makeFallbackCar();
    carWrap.add(carMesh);
    scene.add(carWrap);
    let track = makeFallbackTrack();
    scene.add(track);
    lockTrack(track);
    const state = {x:0,z:33,rot:0,speed:0};
    carWrap.position.set(state.x,0,state.z);
    async function mountAssets(){
      hud.textContent = 'LOADING MESHY GLBS';
      try {
        const race = await loadGLB('/glbs/neon-wave-raceway.glb');
        fit(race, 92);
        lockTrack(race);
        scene.remove(track); track = race; scene.add(track);
        hud.textContent = 'RACEWAY LOCKED';
      } catch { hud.textContent = 'PROCEDURAL TRACK LOCKED'; }
      try {
        const subi = await loadGLB('/glbs/blue-speedster.glb');
        fit(subi, 4.4);
        carWrap.remove(carMesh); carMesh = subi; carWrap.add(carMesh);
        hud.textContent = (hud.textContent.includes('LOCKED')?'MESHY SUBI + TRACK LOCKED':'MESHY SUBI READY');
      } catch {}
    }
    mountAssets();
    function bind(el){
      el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); KEYS[el.dataset.k]=true; });
      el.addEventListener('pointerup', () => { KEYS[el.dataset.k]=false; });
      el.addEventListener('pointercancel', () => { KEYS[el.dataset.k]=false; });
    }
    document.querySelectorAll('.pad').forEach(bind);
    addEventListener('keydown', e => {
      if(e.code==='ArrowUp'||e.code==='KeyW') KEYS.fwd=true;
      if(e.code==='ArrowDown'||e.code==='KeyS') KEYS.back=true;
      if(e.code==='ArrowLeft'||e.code==='KeyA') KEYS.left=true;
      if(e.code==='ArrowRight'||e.code==='KeyD') KEYS.right=true;
      if(e.code==='ShiftLeft'||e.code==='ShiftRight') KEYS.drift=true;
    });
    addEventListener('keyup', e => {
      if(e.code==='ArrowUp'||e.code==='KeyW') KEYS.fwd=false;
      if(e.code==='ArrowDown'||e.code==='KeyS') KEYS.back=false;
      if(e.code==='ArrowLeft'||e.code==='KeyA') KEYS.left=false;
      if(e.code==='ArrowRight'||e.code==='KeyD') KEYS.right=false;
      if(e.code==='ShiftLeft'||e.code==='ShiftRight') KEYS.drift=false;
    });
    document.getElementById('go').onclick = () => {
      document.getElementById('gate').style.display='none';
      running = true; dist = 0;
      state.x=0; state.z=33; state.rot=0; state.speed=0;
    };
    const CAM_BACK = 13.5, CAM_RIGHT = 3.4, CAM_H = 6.8, LOOK_AHEAD = 2.2;
    let last = performance.now();
    function tick(now){
      const dt = Math.min(0.033, (now-last)/1000); last = now;
      if(running){
        const GAS=42, BRAKE=38, REV=16, DRAG=0.91, TURN=1.7;
        if(KEYS.fwd) state.speed = Math.min(state.speed + GAS*dt, 68);
        else if(KEYS.back){
          if(state.speed>1) state.speed = Math.max(state.speed - BRAKE*dt, 0);
          else state.speed = Math.max(state.speed - REV*dt, -16);
        } else state.speed *= DRAG;
        if(Math.abs(state.speed)>0.4 && (KEYS.left||KEYS.right)){
          const dir = state.speed>0?1:-1;
          const rate = KEYS.drift ? TURN*2.3 : TURN;
          if(KEYS.left) state.rot += rate*dt*dir;
          if(KEYS.right) state.rot -= rate*dt*dir;
        }
        state.x += Math.sin(state.rot)*state.speed*dt;
        state.z += Math.cos(state.rot)*state.speed*dt;
        dist += Math.abs(state.speed)*dt;
        const bestNow = Math.max(best0, Math.floor(dist));
        localStorage.setItem('subi-best', String(bestNow));
        scoreEl.innerHTML = Math.floor(dist) + '<br><span style="color:#8ea6b8">BEST '+bestNow+'</span>';
      }
      carWrap.position.set(state.x, 0, state.z);
      carWrap.rotation.y = state.rot;
      const fx = Math.sin(state.rot), fz = Math.cos(state.rot);
      const rx = Math.cos(state.rot), rz = -Math.sin(state.rot);
      camera.position.set(
        state.x - fx*CAM_BACK + rx*CAM_RIGHT,
        CAM_H,
        state.z - fz*CAM_BACK + rz*CAM_RIGHT
      );
      camera.lookAt(state.x + fx*LOOK_AHEAD, 1.05, state.z + fz*LOOK_AHEAD);
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
    addEventListener('resize', () => {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
  </script>
</body>
</html>
